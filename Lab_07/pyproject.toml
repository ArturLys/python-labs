[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.7.0"
description = "Облік студентів — наскрізний навчальний проєкт курсу «Професійний Python»"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Artur Lys", email = "Artur.Lys@lnu.edu.ua" }]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
db = ["sqlalchemy>=2.0", "alembic>=1.13"]
dev = ["mypy>=1.10", "types-PyYAML"]

[project.scripts]
student-manager = "student_manager.main:main"
student-storage = "student_manager.storage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: кілька модулів разом — файли у tmp_path, конфігурація, контейнер (ставиться автоматично у tests/integration/)",
    "slow: довші тести; пропускаються через -m 'not slow'",
]

[tool.coverage.run]
source = ["student_manager"]
branch = true
omit = [
    "*/__main__.py",   # демонстраційні сценарії лабораторних
    "*/main.py",       # консольна точка входу ЛР1
    "*/cli.py",
    "*/benchmark.py",  # експерименти з часом і пам'яттю
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
