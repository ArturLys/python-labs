[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "1.0.0"
description = "Облік студентів — наскрізний навчальний проєкт курсу «Професійний Python»"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Artur Lys", email = "Artur.Lys@lnu.edu.ua" }]
license = "MIT"
keywords = ["students", "fastapi", "sqlalchemy", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24", "httpx>=0.27"]
db = ["sqlalchemy>=2.0", "alembic>=1.13"]
api = ["student-manager[db]", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.0"]
perf = ["numpy>=2.0"]
dev = ["mypy>=1.10", "types-PyYAML", "ruff>=0.6", "build>=1.2", "twine>=5.0"]

[project.scripts]
student-manager = "student_manager.main:main"
student-storage = "student_manager.storage.__main__:main"
student-api = "student_manager.api.__main__:main"

[project.urls]
Repository = "https://github.com/ArturLys/student-manager"
Changelog = "https://github.com/ArturLys/student-manager/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "E741", "B008", "B023", "B905", "SIM102", "SIM108", "SIM117", "UP038", "UP040", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: кілька модулів разом — файли у tmp_path, конфігурація, контейнер (ставиться автоматично у tests/integration/)",
    "slow: довші тести; пропускаються через -m 'not slow'",
]

[tool.coverage.run]
source = ["student_manager"]
branch = true
omit = [
    "*/__main__.py",   # демонстраційні сценарії лабораторних
    "*/main.py",       # консольна точка входу ЛР1
    "*/cli.py",
    "*/benchmark.py",  # експерименти з часом і пам'яттю
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
