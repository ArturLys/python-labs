services:
  api:
    build: .
    image: student-manager:1.0.0
    ports:
      - "8000:8000"
    env_file:
      - .env            # DATABASE_URL, APP_ENV, LOG_LEVEL, API_TOKEN — see .env.example
    volumes:
      - students-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  students-data:
