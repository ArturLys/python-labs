[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.4.0"
description = "Облік студентів — наскрізний навчальний проєкт курсу «Професійний Python»"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Artur Lys", email = "Artur.Lys@lnu.edu.ua" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["mypy>=1.10"]

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
